  <script>
    function getCookie(name) {
      const prefix = `${name}=`;
      return document.cookie.split(';').map(value => value.trim()).find(value => value.startsWith(prefix))?.slice(prefix.length) || null;
    }
    function setCookie(name, value, days) {
      const date = new Date();
      date.setTime(date.getTime() + days * 86400000);
      document.cookie = `${name}=${value}; expires=${date.toUTCString()}; path=/; SameSite=Lax`;
    }
    window.addEventListener('load', () => {
      if (!getCookie('visited')) {
        alert('Bem-vindo ao universo da TWISTAR! Estamos aqui para tornar sua experiência de venda incrível. Explore, descubra e aproveite ao máximo o site de ajuda. Se precisar de assistência, é só me chamar!');
        setCookie('visited', 'true', 365);
      }
    });
  </script>
