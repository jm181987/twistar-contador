<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cripto | Twistar</title>
  <link rel="icon" href="logo.jpg" />
  <link rel="stylesheet" href="assets/module.css" />
</head>
<body class="twistar-module">
  <main class="module-shell">
    <header class="module-header">
      <div class="module-brand">
        <img class="module-logo" src="logo.jpg" alt="Twistar" />
        <div>
          <p class="module-kicker">Mercados</p>
          <h1>Criptomoedas</h1>
        </div>
      </div>
      <div class="module-actions">
        <a class="module-link" href="index.html#crypto">Workspace</a>
        <a class="module-link" href="acoes.html">Ações</a>
        <a class="module-link" href="forex.html">Forex</a>
      </div>
    </header>

    <section class="module-intro">
      <h2>Principais criptoativos</h2>
      <p>Cotações rápidas e mapa de calor para acompanhar os movimentos do mercado cripto.</p>
    </section>

    <div class="widget-stack">
      <section class="widget-card">
        <div class="tradingview-widget-container">
          <div class="tradingview-widget-container__widget"></div>
          <div class="tradingview-widget-copyright"><a href="https://br.tradingview.com/" rel="noopener nofollow" target="_blank">Dados via TradingView</a></div>
          <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js" async>
          {
            "symbols": [
              { "description": "BITCOIN USD", "proName": "BITSTAMP:BTCUSD" },
              { "description": "ETHEREUM USD", "proName": "BINANCE:ETHUSD" },
              { "description": "LITECOIN USD", "proName": "OANDA:LTCUSD" },
              { "description": "USD A YEN", "proName": "PYTH:USDJPY" },
              { "description": "BNB A USD", "proName": "CRYPTO:BNBUSD" }
            ],
            "showSymbolLogo": true,
            "colorTheme": "light",
            "isTransparent": true,
            "displayMode": "adaptive",
            "locale": "br"
          }
          </script>
        </div>
      </section>

      <section class="widget-card">
        <div class="tradingview-widget-container">
          <div class="tradingview-widget-container__widget"></div>
          <div class="tradingview-widget-copyright"><a href="https://br.tradingview.com/" rel="noopener nofollow" target="_blank">Mapa de calor via TradingView</a></div>
          <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-crypto-coins-heatmap.js" async>
          {
            "dataSource": "Crypto",
            "blockSize": "market_cap_calc",
            "blockColor": "change",
            "locale": "br",
            "symbolUrl": "",
            "colorTheme": "light",
            "hasTopBar": true,
            "isDataSetEnabled": true,
            "isZoomEnabled": true,
            "hasSymbolTooltip": true,
            "width": "100%",
            "height": 720
          }
          </script>
        </div>
      </section>
    </div>
  </main>

  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1581201241878955" crossorigin="anonymous"></script>
  <footer>Desenvolvido por <a href="https://wa.me/59893867429">Jorge Marquez</a></footer>
</body>
</html>
