<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculadora de Ganancias | Twistar</title>
  <link rel="icon" href="logo.jpg" />
  <link rel="stylesheet" href="assets/module.css" />
  <style>
    .calculator { max-width: 760px; margin: 0 auto; }
    .field-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px; }
    .field label { display: block; margin-bottom: 6px; font-size: 12px; font-weight: 750; color: #43566b; }
    .field input { width: 100%; }
    .result-list { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px 18px; padding: 0; list-style: none; }
    .result-list li { padding: 8px 10px; border-radius: 9px; background: #f4f8fb; font-size: 13px; }
    .result-total { margin-top: 14px; padding: 14px; border-radius: 12px; background: #e8f7f1; color: #0c6c4c; font-weight: 850; }
    #btnImprimirPDF { display: none; }
    @media (max-width: 680px) { .field-grid, .result-list { grid-template-columns: 1fr; } }
    @media print { .module-header, .module-intro, #btnImprimirPDF, footer { display:none !important; } body { background:#fff; padding:0; } .widget-card { box-shadow:none; border:0; } }
  </style>
</head>
<body class="twistar-module">
  <main class="module-shell">
    <header class="module-header">
      <div class="module-brand">
        <img class="module-logo" src="logo.jpg" alt="Twistar" />
        <div><p class="module-kicker">Calculadoras</p><h1>Ganancias Diarias</h1></div>
      </div>
      <div class="module-actions"><a class="module-link" href="index.html#profit">Workspace</a></div>
    </header>

    <section class="module-intro">
      <h2>Proyección de 20 días</h2>
      <p>Calcula el rendimiento compuesto diario considerando inversión inicial y bonus.</p>
    </section>

    <section class="widget-card calculator">
      <div class="field-grid">
        <div class="field"><label for="inversionInicial">Inversión inicial</label><input type="number" id="inversionInicial" min="0" step="0.01" /></div>
        <div class="field"><label for="bonusPercentual">Bonus (%)</label><input type="number" id="bonusPercentual" min="0" step="0.01" /></div>
        <div class="field"><label for="porcentajeDiario">Porcentaje diario (%)</label><input type="number" id="porcentajeDiario" min="0" max="100" step="0.01" /></div>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px">
        <button type="button" onclick="calcularLucroDiario()">Calcular</button>
        <button id="btnImprimirPDF" type="button" onclick="window.print()">Imprimir en PDF</button>
      </div>
      <div id="resultado" aria-live="polite"></div>
    </section>
  </main>

  <script>
    function calcularLucroDiario() {
      const inversionBase = Number(document.getElementById('inversionInicial').value);
      const bonusPercentual = Number(document.getElementById('bonusPercentual').value || 0);
      const porcentajeDiario = Number(document.getElementById('porcentajeDiario').value);

      if (!Number.isFinite(inversionBase) || inversionBase < 0 || !Number.isFinite(bonusPercentual) || bonusPercentual < 0 || !Number.isFinite(porcentajeDiario) || porcentajeDiario < 0) {
        alert('Por favor, ingresa números válidos.');
        return;
      }

      const inversionInicial = inversionBase + ((inversionBase * bonusPercentual) / 100);
      let inversionAtual = inversionInicial;
      const ganhos = [];

      for (let dia = 1; dia <= 20; dia += 1) {
        const ganhoDia = inversionAtual * (porcentajeDiario / 100);
        ganhos.push(ganhoDia);
        inversionAtual += ganhoDia;
      }

      const totalGanhos = ganhos.reduce((total, ganho) => total + ganho, 0);
      document.getElementById('resultado').innerHTML = `
        <h2>Ganancias diarias</h2>
        <ul class="result-list">${ganhos.map((ganho, index) => `<li>Día ${index + 1}: <strong>$${ganho.toFixed(2)}</strong></li>`).join('')}</ul>
        <div class="result-total">Total de ganancia en 20 días: $${totalGanhos.toFixed(2)}</div>`;
      document.getElementById('btnImprimirPDF').style.display = 'inline-flex';
    }
  </script>

  <footer>Desenvolvido por <a href="https://wa.me/59893867429">Jorge Marquez</a></footer>
</body>
</html>
