<!DOCTYPE html>

<head>
  <meta charset="UTF-8" />

  <link rel="icon" href="logo.jpg" />
  <link rel="stylesheet" href="assets/module.css" />

<body class="twistar-module">
  <main class="module-shell">
    <header class="module-header">
      <div class="module-brand">
        <img class="module-logo" src="logo.jpg" alt="Twistar" />
        <div>
          <p class="module-kicker">Mercados</p>
          <h1>Mapa de Ações</h1>
        </div>
      </div>
      <div class="module-actions">
        <a class="module-link" href="index.html#stocks">Workspace</a>
        <a class="module-link" href="cripto.html">Cripto</a>
        <a class="module-link" href="indice.html">Índices</a>
      </div>
    </header>

    <section class="module-intro">
      <h2>Queda e aumento de ações</h2>
      <p>Visualize rapidamente desempenho, capitalização e setores do S&amp;P 500 em um mapa de calor interativo.</p>
    </section>

    <section class="widget-card">
      <div class="tradingview-widget-container">
        <div class="tradingview-widget-container__widget"></div>
        <div class="tradingview-widget-copyright">
          <a href="https://br.tradingview.com/" rel="noopener nofollow" target="_blank">Monitore todos os mercados no TradingView</a>
        </div>
        <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-stock-heatmap.js" async>
        {
          "exchanges": [],
          "dataSource": "SPX500",
          "grouping": "sector",
          "blockSize": "market_cap_basic",
          "blockColor": "change",
          "locale": "br",
          "symbolUrl": "",
          "colorTheme": "dark",
          "hasTopBar": true,
          "isDataSetEnabled": true,
          "isZoomEnabled": true,
          "hasSymbolTooltip": true,
          "width": "100%",
          "height": 760
        }
        </script>
      </div>
    </section>
  </main>

  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1581201241878955" crossorigin="anonymous"></script>
