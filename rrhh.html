<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Número a Letras RRHH | Twistar</title>
  <link rel="icon" href="logo.jpg" />
  <link rel="stylesheet" href="assets/module.css" />
  <style>
    .converter { max-width: 900px; margin: 0 auto; }
    .converter input { width: 100%; font-size: 24px; padding: 14px 16px; }
    .result-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 16px; }
    .result-box { min-height: 145px; padding: 15px; border: 1px solid #dbe4ee; border-radius: 14px; background: #f8fbfe; }
    .result-box h3 { margin: 0 0 8px; font-size: 13px; color: #66788c; text-transform: uppercase; letter-spacing: .06em; }
    .result-value { min-height: 48px; margin: 0 0 12px; font-weight: 800; line-height: 1.55; overflow-wrap: anywhere; }
    .copy-btn { padding: 7px 10px; font-size: 11px; }
    #alert { position: fixed; right: 18px; bottom: 18px; z-index: 100; padding: 11px 14px; border-radius: 10px; background: #0d2338; color: #fff; opacity: 0; transform: translateY(10px); pointer-events: none; transition: .2s ease; }
    #alert.show { opacity: 1; transform: translateY(0); }
    @media (max-width: 760px) { .result-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body class="twistar-module">
  <main class="module-shell">
    <header class="module-header">
      <div class="module-brand">
        <img class="module-logo" src="logo.jpg" alt="Twistar" />
        <div><p class="module-kicker">Operaciones · RRHH</p><h1>Número a Letras</h1></div>
      </div>
      <div class="module-actions"><a class="module-link" href="index.html#rrhh">Workspace</a></div>
    </header>

    <section class="module-intro">
      <h2>Convierte números al instante</h2>
      <p>Obtén lectura dígito por dígito, cantidad escrita y formato monetario en dólares.</p>
    </section>

    <section class="widget-card converter">
      <label for="numberInput"><strong>Ingresa un número</strong></label>
      <input id="numberInput" type="text" inputmode="decimal" placeholder="Ej.: 1250.75" autocomplete="off" />

      <div class="result-grid">
        <article class="result-box">
          <h3>Dígitos en letras</h3>
          <p class="result-value" id="numberInWords"></p>
          <button class="copy-btn" type="button" data-copy="numberInWords">Copiar</button>
        </article>
        <article class="result-box">
          <h3>Cantidad en letras</h3>
          <p class="result-value" id="numberInQuantity"></p>
          <button class="copy-btn" type="button" data-copy="numberInQuantity">Copiar</button>
        </article>
        <article class="result-box">
          <h3>Dólares</h3>
          <p class="result-value" id="numberInDollars"></p>
          <button class="copy-btn" type="button" data-copy="numberInDollars">Copiar</button>
        </article>
      </div>

      <button id="clearButton" type="button" style="margin-top:14px">Limpiar</button>
    </section>
  </main>

  <div id="alert" role="status">Copiado al portapapeles</div>

  <script>
    const units = ['', 'uno', 'dos', 'tres', 'cuatro', 'cinco', 'seis', 'siete', 'ocho', 'nueve', 'diez', 'once', 'doce', 'trece', 'catorce', 'quince'];
    const tens = ['', '', 'veinte', 'treinta', 'cuarenta', 'cincuenta', 'sesenta', 'setenta', 'ochenta', 'noventa'];
    const hundreds = ['', 'ciento', 'doscientos', 'trescientos', 'cuatrocientos', 'quinientos', 'seiscientos', 'setecientos', 'ochocientos', 'novecientos'];
    const digitWords = ['cero', 'uno', 'dos', 'tres', 'cuatro', 'cinco', 'seis', 'siete', 'ocho', 'nueve'];

    function convertNumberPartToWords(number) {
      number = Math.floor(Number(number));
      if (!Number.isFinite(number)) return '';
      if (number === 0) return 'cero';
      if (number < 0) return `menos ${convertNumberPartToWords(Math.abs(number))}`;
      if (number < 16) return units[number];
      if (number < 20) return `dieci${units[number - 10]}`;
      if (number === 20) return 'veinte';
      if (number < 30) return `veinti${units[number - 20]}`;
      if (number < 100) {
        const rest = number % 10;
        return rest ? `${tens[Math.floor(number / 10)]} y ${units[rest]}` : tens[Math.floor(number / 10)];
      }
      if (number === 100) return 'cien';
      if (number < 1000) {
        const rest = number % 100;
        return rest ? `${hundreds[Math.floor(number / 100)]} ${convertNumberPartToWords(rest)}` : hundreds[Math.floor(number / 100)].replace('ciento', 'cien');
      }
      if (number < 2000) {
        const rest = number - 1000;
        return rest ? `mil ${convertNumberPartToWords(rest)}` : 'mil';
      }
      if (number < 1000000) {
        const thousands = Math.floor(number / 1000);
        const rest = number % 1000;
        return `${convertNumberPartToWords(thousands)} mil${rest ? ` ${convertNumberPartToWords(rest)}` : ''}`;
      }
      if (number < 2000000) {
        const rest = number - 1000000;
        return `un millón${rest ? ` ${convertNumberPartToWords(rest)}` : ''}`;
      }
      if (number < 1000000000) {
        const millions = Math.floor(number / 1000000);
        const rest = number % 1000000;
        return `${convertNumberPartToWords(millions)} millones${rest ? ` ${convertNumberPartToWords(rest)}` : ''}`;
      }
      return String(number);
    }

    function convertNumberToWords(input) {
      const cleaned = String(input).replace(/[^0-9-]/g, '');
      if (!cleaned || cleaned === '-') return '';
      return convertNumberPartToWords(Number(cleaned));
    }

    function convertNumberToDigits(input) {
      return String(input).split('').map(char => {
        if (/\d/.test(char)) return digitWords[Number(char)];
        if (char === '-') return 'menos';
        if (char === '.' || char === ',') return 'punto';
        return char.toUpperCase();
      }).join(' ').replace(/\s+/g, ' ').trim();
    }

    function convertNumber() {
      const raw = document.getElementById('numberInput').value.trim();
      const normalized = raw.replace(',', '.');
      const integerPart = normalized.split('.')[0];
      const decimalPart = normalized.includes('.') ? normalized.split('.')[1].replace(/\D/g, '').slice(0, 2) : '';

      document.getElementById('numberInWords').textContent = convertNumberToDigits(normalized).toUpperCase();
      document.getElementById('numberInQuantity').textContent = convertNumberToWords(integerPart).toUpperCase();

      const dollars = document.getElementById('numberInDollars');
      if (decimalPart && /^-?\d+$/.test(integerPart)) {
        const cents = decimalPart.padEnd(2, '0');
        dollars.textContent = `${convertNumberToWords(integerPart)} DÓLARES DE LOS ESTADOS UNIDOS DE AMÉRICA CON ${convertNumberToWords(cents)} CENTAVOS`.toUpperCase();
      } else {
        dollars.textContent = '';
      }
    }

    function showAlert() {
      const alert = document.getElementById('alert');
      alert.classList.add('show');
      window.setTimeout(() => alert.classList.remove('show'), 1700);
    }

    async function copyResult(id) {
      const text = document.getElementById(id).textContent.trim();
      if (!text) return;
      await navigator.clipboard.writeText(text);
      showAlert();
    }

    function clearInput() {
      document.getElementById('numberInput').value = '';
      ['numberInWords', 'numberInQuantity', 'numberInDollars'].forEach(id => document.getElementById(id).textContent = '');
      document.getElementById('numberInput').focus();
    }

    document.getElementById('numberInput').addEventListener('input', convertNumber);
    document.getElementById('clearButton').addEventListener('click', clearInput);
    document.querySelectorAll('[data-copy]').forEach(button => button.addEventListener('click', () => copyResult(button.dataset.copy)));
  </script>

  <footer>Desenvolvido por <a href="https://wa.me/59893867429">Jorge Marquez</a></footer>
</body>
</html>
